plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.siot'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / Validation
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-vector'          // pgvector 매핑
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Security / Session / Redis
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API 문서 (Swagger UI: /swagger-ui.html, OpenAPI JSON: /v3/api-docs). 운영은 기본 꺼짐
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // Mail (Gmail SMTP: NTF-09 이메일 인증, M-11 비밀번호 재설정, NTF-05 알림 이메일)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 챗봇·번역·문서 적재: LangChain4j + Gemini. Vertex AI(서비스 계정)와 AI Studio(API 키)를 모두 지원하는 google-genai SDK 기반
    implementation 'dev.langchain4j:langchain4j-google-genai:1.22.0-beta32'

    // 문서 적재 (ADM-04): PDF 쪽별 텍스트 추출
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    // Lombok / Config metadata
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 운영(Dockerfile -Duser.timezone=Asia/Seoul)과 같은 JVM 시간대. hibernate.jdbc.time_zone=Asia/Seoul 과 다르면
    // TIME 컬럼(event.starts_at 등)을 LocalTime 으로 읽을 때 시차만큼 바뀐다 (CI 는 UTC)
    systemProperty 'user.timezone', 'Asia/Seoul'
}

// 실행 가능한 bootJar 하나만 생성 (plain jar 비활성화)
tasks.named('jar') {
    enabled = false
}

// Docker 빌드의 의존성 레이어용 (Dockerfile): bootJar 에 필요한 라이브러리 파일(JAR)까지 미리 받는다.
// `dependencies` 작업은 목록(POM)만 받아서, 이 작업 없이는 bootJar 가 빌드마다 Maven Central 에서 JAR 를 다시 받았다.
tasks.register('downloadDependencies') {
    description = 'Downloads the libraries bootJar needs (compile, annotation processing, runtime).'
    def classpaths = ['compileClasspath', 'annotationProcessor', 'runtimeClasspath', 'productionRuntimeClasspath']
            .collect { configurations.named(it) }
    doLast {
        classpaths.each { it.get().resolve() }
    }
}
