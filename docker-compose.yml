# Siot Backend 실행 환경 (backend + PostgreSQL(pgvector) + Redis)
# 프론트엔드 컨테이너는 별도 담당자가 관리한다. 통합 방법: docs/compose-integration.md
#
# 사용법:
#   cp .env.example .env   # 값 수정
#   docker compose up -d --build
#   (DB/Redis만 띄우고 IDE에서 실행) docker compose up -d postgres redis
#   (개발용 메일 서버 포함) docker compose --profile dev up -d   → 받은 메일: http://localhost:8025
name: siot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siot}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    image: ${BACKEND_IMAGE:-asia-northeast3-docker.pkg.dev/siot-514601/siot/siot-backend:latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-siot}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-14d}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      EVENT_COLLECT_CRON: ${EVENT_COLLECT_CRON:-0 0 3 * * *}
      NOTIFICATION_DISPATCH_INTERVAL: ${NOTIFICATION_DISPATCH_INTERVAL:-1m}
      # ADM-01: 관리자로 지정할 이메일 (쉼표 구분)
      SIOT_ADMIN_EMAILS: ${SIOT_ADMIN_EMAILS:-}
      # 챗봇 (Gemini). 비어 있으면 챗봇은 안내 문구로만 응답한다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      CHATBOT_MIN_RELEVANCE: ${CHATBOT_MIN_RELEVANCE:-0.6}
      # 메일: 기본값은 개발용 Mailpit. 운영은 .env 에 Gmail SMTP 값을 넣는다 (docs/deployment.md)
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-웰컴시흥 <no-reply@siot.local>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # API 문서 (/swagger-ui.html). prod 프로필은 기본 꺼짐, 로컬 compose 에서 보려면 .env 에 true
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 개발용 메일 서버 (운영에서는 띄우지 않는다): docker compose --profile dev up -d
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # 웹 UI
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  postgres-data:
  redis-data:
