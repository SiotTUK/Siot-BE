# Siot Backend 실행 환경 (backend + PostgreSQL(pgvector) + Redis)
# 운영 VM 은 web 프로필(Caddy)도 띄운다: 프론트엔드 정적 파일 + /api 프록시 + HTTPS (docs/deployment.md)
#
# 사용법:
#   cp .env.example .env   # 값 수정
#   docker compose up -d --build
#   (DB/Redis만 띄우고 IDE에서 실행) docker compose up -d postgres redis
#   (개발용 메일 서버 포함) docker compose --profile dev up -d   → 받은 메일: http://localhost:8025
name: siot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siot}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    image: ${BACKEND_IMAGE:-asia-northeast3-docker.pkg.dev/siot-514601/siot/siot-backend:latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-siot}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-14d}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      EVENT_COLLECT_CRON: ${EVENT_COLLECT_CRON:-0 0 3 * * *}
      NOTIFICATION_DISPATCH_INTERVAL: ${NOTIFICATION_DISPATCH_INTERVAL:-1m}
      # ADM-01: 관리자로 지정할 이메일 (쉼표 구분)
      SIOT_ADMIN_EMAILS: ${SIOT_ADMIN_EMAILS:-}
      # Gemini (챗봇·번역·문서 적재). GEMINI_PROJECT_ID 가 있으면 Vertex AI(VM 서비스 계정), 없으면 GEMINI_API_KEY.
      # 둘 다 비어 있으면 챗봇은 안내 문구로만 응답하고 번역·적재는 실패한다
      GEMINI_PROJECT_ID: ${GEMINI_PROJECT_ID:-}
      GEMINI_LOCATION: ${GEMINI_LOCATION:-global}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.1-flash-lite}
      # RUL-07 고지서 사진 번역 전용 모델 (비우면 GEMINI_CHAT_MODEL)·1회 호출 제한 시간
      GEMINI_BILL_MODEL: ${GEMINI_BILL_MODEL:-}
      GEMINI_BILL_TIMEOUT: ${GEMINI_BILL_TIMEOUT:-45s}
      CHATBOT_MIN_RELEVANCE: ${CHATBOT_MIN_RELEVANCE:-0.6}
      # EVE-01: 행사 수집 공공데이터포털 키 (TourAPI·축제표준데이터). 비어 있으면 두 출처는 FAILED
      EVENT_API_KEY: ${EVENT_API_KEY:-}
      # 사용자에게 보여 주는 행사 지역. SIHEUNG,GYEONGGI 면 경기도 행사도 보인다
      EVENT_PUBLIC_REGIONS: ${EVENT_PUBLIC_REGIONS:-SIHEUNG}
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      # ADM-02: 업로드한 PDF 저장 폴더 (아래 document-data 볼륨). 컨테이너를 다시 만들어도 남아야 재실행할 수 있다
      DOCUMENT_STORAGE_DIR: /app/data/documents
      # 메일: 기본값은 개발용 Mailpit. 운영은 .env 에 Gmail SMTP 값을 넣는다 (docs/deployment.md)
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-웰컴시흥 <no-reply@siot.local>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # API 문서 (/swagger-ui.html). prod 프로필은 기본 꺼짐, 로컬 compose 에서 보려면 .env 에 true
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - document-data:/app/data/documents
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 운영 웹 서버 (VM .env 의 COMPOSE_PROFILES=web 일 때만 뜬다).
  # 한 도메인에서 프론트엔드(./frontend 의 빌드 결과)를 서빙하고 /api 는 backend 로 넘긴다.
  # 같은 출처라 세션 쿠키·CSRF 가 그대로 동작한다. SITE_ADDRESS 가 도메인이면 Let's Encrypt 인증서를 자동 발급한다
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

  # 개발용 메일 서버 (운영에서는 띄우지 않는다): docker compose --profile dev up -d
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # 웹 UI
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  postgres-data:
  redis-data:
  document-data:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    content: |
      ${SITE_ADDRESS:-:80} {
        encode zstd gzip

        # API·헬스 체크·API 문서는 백엔드로 (X-Forwarded-* 는 Caddy 가 붙인다)
        @backend path /api/* /actuator/health /actuator/health/* /swagger-ui.html /swagger-ui/* /v3/api-docs /v3/api-docs/*
        handle @backend {
          reverse_proxy backend:8080
        }

        # 그 외는 프론트엔드
        handle {
          root * /srv

          # 해시가 붙은 빌드 파일: 있으면 1년 캐시
          @asset {
            path /assets/*
            file
          }
          handle @asset {
            header Cache-Control "public, max-age=31536000, immutable"
            file_server
          }

          # 없는 빌드 파일은 index.html 로 대신하지 않고 캐시하지 않는 404.
          # index.html 로 답하면 브라우저가 그 HTML 을 CSS·JS 자리에 1년 동안 캐시해 화면이 깨진다
          # (배포 중이나 배포 전에 열어 둔 탭이 예전 파일을 요청할 때)
          handle /assets/* {
            header Cache-Control "no-store"
            respond 404
          }

          # 화면 경로 (SPA: 없는 경로는 index.html)
          handle {
            header Cache-Control "no-cache"
            try_files {path} /index.html
            file_server
          }
        }
      }
