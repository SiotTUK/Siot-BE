# 공통 설정 - 민감정보는 모두 환경변수로 주입한다.
spring:
  application:
    name: siot-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway만 변경한다
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    # M-10: 14일 동안 요청이 없으면 세션 만료
    timeout: ${SESSION_TIMEOUT:14d}
    data:
      redis:
        namespace: siot:session
        flush-mode: on-save
        # M-11: 비밀번호 재설정 시 해당 회원의 모든 세션 삭제 (사용자별 세션 조회 필요)
        repository-type: indexed

  # 메일: 운영은 Gmail SMTP (smtp.gmail.com:587, STARTTLS, 앱 비밀번호)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  # 메일 문구 다국어 (messages/mail*.properties)
  messages:
    basename: messages/mail
    fallback-to-system-locale: false

  # ADM-02: 문서(PDF) 업로드 한도
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
      # RUL-07: 고지서 사진(10MB 이하)은 디스크 임시 파일 없이 메모리에서만 받는다. 이보다 큰 파일(문서)만 임시 파일로
      file-size-threshold: 10MB

  task:
    execution:
      thread-name-prefix: siot-async-   # 메일 비동기 발송
    scheduling:
      thread-name-prefix: siot-scheduler-
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}   # 행사 수집과 알림 발송이 서로 막지 않도록
      shutdown:
        await-termination: true
        await-termination-period: 30s

siot:
  # ADM-01: 처음부터 관리자로 지정할 이메일 (쉼표 구분)
  admin:
    emails: ${SIOT_ADMIN_EMAILS:}
  # 챗봇 (CB-12~17). 근거 기준값은 실제 문서 적재 후 평가 세트(CB-01)로 조정한다
  chatbot:
    min-relevance: ${CHATBOT_MIN_RELEVANCE:0.6}
    top-k: ${CHATBOT_TOP_K:5}
    max-sources: 3
    max-question-length: 1000
    # 이어지는 질문(CB-07)에 쓰는 최근 대화 턴 수
    history-turns: 3
  # Gemini (LangChain4j). 챗봇·번역·문서 적재가 같이 쓴다. project-id(Vertex AI)가 있으면 우선, 없으면 api-key(AI Studio).
  # 둘 다 없으면 챗봇은 "지금은 답변할 수 없어요" 로 응답하고 번역·적재는 실패한다
  gemini:
    project-id: ${GEMINI_PROJECT_ID:}
    # gemini-3.x 는 global 리전에서만 제공된다
    location: ${GEMINI_LOCATION:global}
    api-key: ${GEMINI_API_KEY:}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
    # 문서 적재(역할 B)와 반드시 같은 모델·차원 (document_chunk.embedding VECTOR(768))
    embedding-model: gemini-embedding-001
    embedding-dimension: 768
    temperature: 0.2
    timeout: 20s
  # 문서 적재 (ADM-02~04, DocumentProperties)
  document:
    # 업로드한 PDF 저장 폴더. 실패 버전 재실행에 원본이 필요하므로 지우지 않는다
    storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
    # 무료 등급 한도: 묶어서 호출하고 묶음 사이에 쉰다. 429·503 이면 기다렸다 재시도, 계속 실패하면 FAILED
    embedding-batch-size: 100
    embedding-batch-pause: 2s
    embedding-retry-wait: 60s
    embedding-max-retries: 2
  # 행사 수집 (EVE-01·EVE-02, EventProperties). 매일 siot.scheduling.event-collect-cron 에 출처별로 수집한다
  event:
    # 공공데이터포털 키: TourAPI·전국문화축제표준데이터. 비어 있으면 두 출처는 FAILED 로 기록 (지지씨는 키 없이 동작)
    api-key: ${EVENT_API_KEY:}
    http-timeout: 30s
    # 번역(Gemini) 호출 사이 간격. 실패하면 남은 행사는 다음 주기에 다시 번역한다
    translation-pause: 1s
    ggc:
      base-url: https://ggc.ggcf.kr/open/json/playongoing
      per-page: 100
      max-pages: 10
    tourapi:
      base-url: https://apis.data.go.kr/B551011/KorService2/searchFestival2
      page-size: 1000
      max-pages: 5
      # eventStartDate = 오늘 - 365일 (진행 중인 축제가 빠지지 않게). 저장은 종료일 >= 오늘만
      lookback-days: 365
      # 시흥시 법정동 코드 (경기 41, 시흥 390)
      region-code: "41"
      district-code: "390"
      # 행사마다 원문 링크(homepage)·설명(overview)을 한 번 더 받는다. 실패하면 그 행사는 목록 값만으로 저장
      detail-url: https://apis.data.go.kr/B551011/KorService2/detailCommon2
    festival:
      base-url: https://api.data.go.kr/openapi/tn_pubr_public_cltur_fstvl_api
      page-size: 1000
      max-pages: 5
      address-prefix: 경기도 시흥시
  # 번역 (TranslationProperties). 고지서 사진 번역(RUL-07)은 사진을 저장하지 않는다
  translation:
    # 고지서 사진(RUL-07) 전용 모델. 비어 있으면 siot.gemini.chat-model 을 쓴다
    bill-model: ${GEMINI_BILL_MODEL:}
    # 사진 읽기 1회 호출 제한 시간. 사진은 글보다 오래 걸린다 (라이브 확인 9~31초). 넘으면 503 AI_UNAVAILABLE
    bill-timeout: ${GEMINI_BILL_TIMEOUT:45s}
    bill-max-file-size: 10MB
    bill-retry-wait: 2s
    # 회원당 시간당 10회 (Gemini 무료 한도를 챗봇과 같이 쓴다). 넘으면 429
    bill-rate-limit:
      max-requests: ${BILL_RATE_LIMIT_MAX_REQUESTS:10}
      window: 1h
      min-interval: 2s
  mail:
    # Gmail SMTP 는 로그인한 계정(또는 등록된 별칭) 주소로만 발신할 수 있다
    from: ${MAIL_FROM}
  frontend:
    # 메일 안의 링크(비밀번호 재설정 등)에 사용하는 프론트엔드 주소
    base-url: ${FRONTEND_BASE_URL}

  # 예약 작업 (SchedulingProperties)
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    zone: Asia/Seoul
    event-collect-cron: ${EVENT_COLLECT_CRON:0 0 3 * * *}                         # EVE-01: 매일 새벽 3시
    notification-dispatch-interval: ${NOTIFICATION_DISPATCH_INTERVAL:1m}          # NTF-05

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: SIOT_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # metrics 는 ADMIN 만 접근 (SecurityConfig)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
    mail:
      # 외부 SMTP(Gmail) 상태 때문에 백엔드가 unhealthy 로 판정되지 않도록 제외한다 (발송 실패는 로그로 확인)
      enabled: false

# API 문서 (Swagger UI: /swagger-ui.html). 운영 프로필은 기본 꺼짐 (application-prod.yml)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    csrf:
      enabled: true          # XSRF-TOKEN 쿠키 → X-XSRF-TOKEN 헤더 (Spring Security 기본 이름과 같음)
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json
