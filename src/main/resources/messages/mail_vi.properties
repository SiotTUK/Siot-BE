mail.email-verification.subject=[Welcome Siheung] Mã xác minh email
mail.email-verification.body=Đây là mã xác minh email Welcome Siheung của bạn.\n\nMã xác minh: {0}\n\nVui lòng nhập trong vòng {1} phút.\nNếu bạn không yêu cầu, vui lòng bỏ qua email này.
mail.password-reset.subject=[Welcome Siheung] Đặt lại mật khẩu
mail.password-reset.body=Có yêu cầu đặt lại mật khẩu cho tài khoản có ID {0}.\n\nVui lòng đặt mật khẩu mới qua liên kết bên dưới. Liên kết chỉ dùng được một lần trong vòng {2} phút.\n{1}\n\nNếu bạn không yêu cầu, vui lòng bỏ qua email này. Mật khẩu của bạn sẽ không thay đổi.
