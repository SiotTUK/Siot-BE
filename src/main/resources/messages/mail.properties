# 기본(한국어). MessageFormat 문법이므로 작은따옴표(')는 쓰지 않는다.
mail.email-verification.subject=[웰컴시흥] 이메일 인증 코드
mail.email-verification.body=웰컴시흥 이메일 인증 코드입니다.\n\n인증 코드: {0}\n\n{1}분 안에 입력해 주세요.\n본인이 요청하지 않았다면 이 메일을 무시해 주세요.
mail.password-reset.subject=[웰컴시흥] 비밀번호 재설정
mail.password-reset.body={0} 계정의 비밀번호 재설정을 요청하셨습니다.\n\n아래 링크에서 새 비밀번호를 설정해 주세요. 링크는 {2}분 동안 한 번만 사용할 수 있습니다.\n{1}\n\n본인이 요청하지 않았다면 이 메일을 무시해 주세요. 비밀번호는 바뀌지 않습니다.
