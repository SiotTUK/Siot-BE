# 로컬 개발 프로필
# 프로젝트 루트의 .env 파일(.env.example 참고)이 있으면 값을 읽어온다.
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siot}

  data:
    redis:
      host: ${REDIS_HOST:localhost}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.siot.backend: DEBUG
    org.hibernate.SQL: DEBUG
