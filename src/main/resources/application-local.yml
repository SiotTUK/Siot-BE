# 로컬 개발 프로필
# 프로젝트 루트의 .env 파일(.env.example 참고)이 있으면 값을 읽어온다.
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siot}

  data:
    redis:
      host: ${REDIS_HOST:localhost}

  flyway:
    # 브랜치 병합 순서 때문에 로컬 DB에 더 늦은 버전이 먼저 적용된 경우에도 기동되도록 허용 (로컬 전용)
    out-of-order: true

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.siot.backend: DEBUG
    org.hibernate.SQL: DEBUG
